services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: reviewapp-postgres
    environment:
      POSTGRES_USER: reviewapp
      POSTGRES_PASSWORD: reviewapp
      POSTGRES_DB: reviewapp
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - reviewapp-pg-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reviewapp -d reviewapp']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: apps/backend
    container_name: reviewapp-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://reviewapp:reviewapp@postgres:5432/reviewapp
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    profiles: [full]

volumes:
  reviewapp-pg-data:
